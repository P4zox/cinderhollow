<meta charset="utf-8">
<title>Cinderhollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap">
<style>
  :root { color-scheme: dark; --ground: #050407; --ink: #e8dcc0; --gold: #b08a3a; --btn: rgba(20, 16, 24, 0.72); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden;
         font-family: 'Cinzel', Georgia, serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; }
  #game { display: block; image-rendering: pixelated; cursor: crosshair; }
  #game:focus-visible { outline: 1px solid var(--gold); }
  .pad { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: none; gap: 8px; }
  .pad.left { left: 12px; flex-wrap: wrap; width: 150px; }
  .pad.right { right: 12px; flex-wrap: wrap; width: 200px; justify-content: flex-end; }
  .pad button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); background: var(--btn);
                color: var(--ink); font: 600 10px 'Cinzel', Georgia, serif; touch-action: none; }
  .pad button:active { background: rgba(176, 138, 58, 0.35); }
  .top { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 12px; display: none; gap: 8px; }
  .top button { height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--gold); background: var(--btn); color: var(--ink); font: 600 10px 'Cinzel', Georgia, serif; }
  @media (pointer: coarse) { .pad, .top { display: flex; } }
</style>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Cinderhollow game canvas"></canvas></div>
<div class="pad left">
  <button data-act="up" aria-label="Up" style="margin-left:52px">▲</button>
  <button data-act="left" aria-label="Move left">◀</button>
  <button data-act="down" aria-label="Down">▼</button>
  <button data-act="right" aria-label="Move right">▶</button>
</div>
<div class="pad right">
  <button data-act="heal">Flask</button>
  <button data-act="cast">Cast</button>
  <button data-act="parry">Parry</button>
  <button data-act="art">Art</button>
  <button data-act="hook">Hook</button>
  <button data-act="interact">Use</button>
  <button data-act="heavy">Heavy</button>
  <button data-act="roll">Roll</button>
  <button data-act="attack">Strike</button>
  <button data-act="jump">Jump</button>
</div>
<div class="top">
  <button data-act="map">Map</button>
  <button data-act="pause">Menu</button>
  <button data-act="confirm">OK</button>
</div>
